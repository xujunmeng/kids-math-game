<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>凑数大冒险 · 儿童数学益智</title>
<style>
  :root {
    --bg1: #fff7e6;
    --bg2: #ffe0f0;
    --board-bg: #f3d9b1;
    --cell-bg: #f8ead1;
    --ink: #5b4636;
    --accent: #ff8a3d;
    --gap: 3%;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", "SimHei", sans-serif;
    color: var(--ink);
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    overflow: hidden;
    touch-action: manipulation;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .app {
    width: 100%;
    max-width: 460px;
    max-height: 100%;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ===== 首页 ===== */
  .home {
    text-align: center;
    animation: fadeIn .4s ease;
  }
  .home h1 {
    font-size: 40px;
    margin: 6px 0 2px;
    color: var(--accent);
    text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(0,0,0,.08);
    letter-spacing: 2px;
  }
  .home .sub {
    font-size: 17px;
    margin: 0 0 20px;
    color: #8a7a68;
  }
  .home .tip {
    font-size: 15px;
    color: #a5927d;
    margin-top: 18px;
    line-height: 1.6;
  }
  .level-title { font-size: 18px; margin: 10px 0; color:#7a6753; }
  .group-title {
    font-size: 16px;
    font-weight: 800;
    margin: 14px 0 8px;
    color: #8a7a68;
    text-align: left;
  }

  .levels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .levels .lv {
    grid-column: span 1;
    border: none;
    border-radius: 20px;
    padding: 18px 0;
    font-size: 26px;
    font-weight: 800;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 0 rgba(0,0,0,.14), inset 0 -4px 0 rgba(0,0,0,.08);
    transition: transform .08s ease, box-shadow .08s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .levels .lv small { font-size: 12px; font-weight: 600; opacity: .92; }
  .levels .lv:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.14); }
  .levels .lv.wide { grid-column: span 2; }

  .lv-6  { background: linear-gradient(135deg,#7ad3ff,#4aa8f0); }
  .lv-7  { background: linear-gradient(135deg,#8be0b0,#45c07a); }
  .lv-8  { background: linear-gradient(135deg,#ffb4d6,#f078b0); }
  .lv-9  { background: linear-gradient(135deg,#c4a8ff,#8f6cf0); }
  .lv-10 { background: linear-gradient(135deg,#ff9a56,#ff6a88); }
  .lv-20 { background: linear-gradient(135deg,#6fd08c,#37b26e); }
  .lv-30 { background: linear-gradient(135deg,#5ec3ff,#3a8dff); }
  .lv-40 { background: linear-gradient(135deg,#b18cff,#8a5cff); }
  .lv-50 { background: linear-gradient(135deg,#ffcf5c,#ff9f1c); }

  .diff-row {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 16px;
  }
  .diff-btn {
    border: 3px solid transparent;
    border-radius: 16px;
    padding: 12px 6px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    background: #fff;
    color: var(--ink);
    box-shadow: 0 3px 0 rgba(0,0,0,.1);
    transition: transform .08s ease, box-shadow .08s ease, border-color .12s ease, background .12s ease;
  }
  .diff-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.1); }
  .diff-btn.active {
    border-color: var(--accent);
    background: #fff3e8;
    color: var(--accent);
    box-shadow: 0 3px 0 rgba(255,138,61,.35);
  }
  .diff-easy.active { border-color: #37b26e; background: #e8f8ef; color: #2a9d5c; box-shadow: 0 3px 0 rgba(55,178,110,.3); }
  .diff-medium.active { border-color: var(--accent); background: #fff3e8; color: var(--accent); }
  .diff-hard.active { border-color: #e05a6a; background: #ffe8ec; color: #d64555; box-shadow: 0 3px 0 rgba(224,90,106,.3); }

  /* ===== 游戏页 ===== */
  .game { display: none; animation: fadeIn .35s ease; }
  .game.active { display: block; }
  .home.hidden { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .btn {
    border: none;
    background: #fff;
    color: var(--ink);
    border-radius: 14px;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,.12); }
  .btn.primary { background: var(--accent); color:#fff; }

  .goal {
    flex: 1;
    text-align: center;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
  }

  .scores {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .score-box {
    flex: 1;
    background: #fff;
    border-radius: 16px;
    padding: 8px 6px;
    text-align: center;
    box-shadow: 0 3px 0 rgba(0,0,0,.08);
  }
  .score-box .label { font-size: 12px; color:#a5927d; }
  .score-box .value { font-size: 24px; font-weight: 800; }

  .board-wrap { position: relative; }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    background: var(--board-bg);
    border-radius: 20px;
    padding: var(--gap);
    box-shadow: inset 0 3px 10px rgba(0,0,0,.12);
    touch-action: none;
    user-select: none;
  }

  .grid-bg {
    position: absolute;
    inset: var(--gap);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: var(--gap);
  }
  .grid-bg .cell {
    background: var(--cell-bg);
    border-radius: 14px;
  }

  .tiles {
    position: absolute;
    inset: var(--gap);
  }

  .tile {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    font-weight: 800;
    color: #fff;
    text-shadow: 1px 1px 0 rgba(0,0,0,.12);
    transition: left .13s ease, top .13s ease;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.12);
    will-change: left, top;
  }

  .tile.new { animation: pop-in .18s ease; }
  .tile.gone { animation: pop-out .16s ease forwards; }

  @keyframes pop-in {
    0% { transform: scale(.1); }
    70% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }
  @keyframes pop-out {
    0% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1.5); opacity: 0; }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px);} to {opacity:1; transform:none;} }

  /* 数字配色（按大小循环，糖果色） */
  .c1 { background: linear-gradient(135deg,#ff9a9e,#ff6a88); }
  .c2 { background: linear-gradient(135deg,#ffb86c,#ff8a3d); }
  .c3 { background: linear-gradient(135deg,#ffd166,#ffb703); }
  .c4 { background: linear-gradient(135deg,#a8e063,#56ab2f); }
  .c5 { background: linear-gradient(135deg,#43e97b,#2bb673); }
  .c6 { background: linear-gradient(135deg,#48c6ef,#3a8dff); }
  .c7 { background: linear-gradient(135deg,#6a9bff,#4364f7); }
  .c8 { background: linear-gradient(135deg,#b18cff,#8a5cff); }
  .c9 { background: linear-gradient(135deg,#f78ca0,#f062c0); }

  .hint {
    text-align: center;
    margin-top: 14px;
    font-size: 16px;
    color: #8a7a68;
    min-height: 24px;
    line-height: 1.4;
  }

  .combo-float {
    position: absolute;
    left: 50%;
    top: 40%;
    transform: translate(-50%,-50%);
    font-size: 34px;
    font-weight: 900;
    color: var(--accent);
    text-shadow: 2px 2px 0 #fff;
    pointer-events: none;
    animation: combo 0.7s ease forwards;
    z-index: 5;
  }
  @keyframes combo {
    0% { opacity: 0; transform: translate(-50%,-30%) scale(.6); }
    30% { opacity: 1; transform: translate(-50%,-55%) scale(1.15); }
    100% { opacity: 0; transform: translate(-50%,-90%) scale(1); }
  }

  /* 结束遮罩 */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,.86);
    border-radius: 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 10;
  }
  .overlay.show { display: flex; animation: fadeIn .3s ease; }
  .overlay .big { font-size: 30px; font-weight: 900; color: var(--accent); }
  .overlay .mid { font-size: 18px; color:#7a6753; }

  .sound-toggle {
    background: #fff; border:none; border-radius: 50%;
    width: 42px; height: 42px; font-size: 18px; cursor: pointer;
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
  }
</style>
</head>
<body>
<div class="app">

  <!-- 首页 -->
  <section class="home" id="home">
    <h1>凑数大冒险</h1>
    <p class="sub">滑动方块，两个数加起来正好凑成目标数就消掉！<br>先从凑 6～10 练起吧</p>
    <div class="level-title">先选难度</div>
    <div class="diff-row" id="diffRow">
      <button type="button" class="diff-btn diff-easy" data-diff="easy">简单</button>
      <button type="button" class="diff-btn diff-medium active" data-diff="medium">中等</button>
      <button type="button" class="diff-btn diff-hard" data-diff="hard">困难</button>
    </div>

    <div class="group-title">入门 · 小凑数</div>
    <div class="levels">
      <button class="lv lv-6" data-target="6">凑 6<small>练习 6 以内加减</small></button>
      <button class="lv lv-7" data-target="7">凑 7<small>练习 7 以内加减</small></button>
      <button class="lv lv-8" data-target="8">凑 8<small>练习 8 以内加减</small></button>
      <button class="lv lv-9" data-target="9">凑 9<small>练习 9 以内加减</small></button>
      <button class="lv lv-10 wide" data-target="10">凑 10<small>练习 10 以内加减</small></button>
    </div>

    <div class="group-title">进阶 · 大凑数</div>
    <div class="levels">
      <button class="lv lv-20" data-target="20">凑 20<small>练习 20 以内加减</small></button>
      <button class="lv lv-30" data-target="30">凑 30<small>练习 30 以内加减</small></button>
      <button class="lv lv-40" data-target="40">凑 40<small>练习 40 以内加减</small></button>
      <button class="lv lv-50" data-target="50">凑 50<small>练习 50 以内加减</small></button>
    </div>
    <p class="tip">小提示：看到一个数字，想一想<br>「还差几就能凑成目标数呢？」</p>
  </section>

  <!-- 游戏页 -->
  <section class="game" id="game">
    <div class="topbar">
      <button class="btn" id="backBtn">← 返回</button>
      <div class="goal" id="goalText">凑 10</div>
      <button class="sound-toggle" id="soundBtn" title="音效开关">🔊</button>
      <button class="btn primary" id="restartBtn">重来</button>
    </div>

    <div class="scores">
      <div class="score-box">
        <div class="label">得分</div>
        <div class="value" id="scoreVal">0</div>
      </div>
      <div class="score-box">
        <div class="label">最高分</div>
        <div class="value" id="bestVal">0</div>
      </div>
    </div>

    <div class="board-wrap">
      <div class="board" id="board">
        <div class="grid-bg" id="gridBg"></div>
        <div class="tiles" id="tiles"></div>
        <div class="overlay" id="overlay">
          <div class="big" id="overTitle">棋盘满啦！</div>
          <div class="mid" id="overSub">这局得了 0 分</div>
          <button class="btn primary" id="overRestart">再来一局</button>
        </div>
      </div>
    </div>

    <div class="hint" id="hint">用手指滑动，或用键盘方向键 ← ↑ → ↓</div>
  </section>

</div>

<script>
(function () {
  "use strict";

  var SIZE = 4;
  var COLORS = ["c1","c2","c3","c4","c5","c6","c7","c8","c9"];

  // easy / medium / hard 难度参数
  var DIFFICULTY = {
    easy:   { label: "简单", friendRate: 0.85, uniform: false, doubleSpawnChance: 0 },
    medium: { label: "中等", friendRate: 0.50, uniform: false, doubleSpawnChance: 0 },
    hard:   { label: "困难", friendRate: 0.20, uniform: true,  doubleSpawnChance: 0.40 }
  };

  var state = {
    target: 10,
    difficulty: "medium",
    grid: [],        // SIZE x SIZE，存 tile 对象或 null
    tiles: [],       // 当前存活 tile 列表
    score: 0,
    best: 0,
    idSeq: 1,
    over: false,
    soundOn: true
  };

  function diffCfg() {
    return DIFFICULTY[state.difficulty] || DIFFICULTY.medium;
  }

  // DOM
  var elHome = document.getElementById("home");
  var elGame = document.getElementById("game");
  var elGridBg = document.getElementById("gridBg");
  var elTiles = document.getElementById("tiles");
  var elBoard = document.getElementById("board");
  var elGoal = document.getElementById("goalText");
  var elScore = document.getElementById("scoreVal");
  var elBest = document.getElementById("bestVal");
  var elHint = document.getElementById("hint");
  var elOverlay = document.getElementById("overlay");
  var elOverSub = document.getElementById("overSub");
  var elSoundBtn = document.getElementById("soundBtn");

  var HINTS = [
    "想一想：几和几加起来是 {t} 呢？",
    "太棒了，继续找能凑成 {t} 的好朋友！",
    "看到一个数，就想想它还差几到 {t}。",
    "把能凑成 {t} 的两个数滑到一起吧！",
    "动动脑筋，凑成 {t} 就能消掉哦！"
  ];

  /* ---------- 背景格子 ---------- */
  function buildGridBg() {
    elGridBg.innerHTML = "";
    for (var i = 0; i < SIZE * SIZE; i++) {
      var c = document.createElement("div");
      c.className = "cell";
      elGridBg.appendChild(c);
    }
  }

  /* ---------- 位置计算 ---------- */
  function cellRect(r, c) {
    var cell = elGridBg.children[r * SIZE + c];
    return {
      left: cell.offsetLeft,
      top: cell.offsetTop,
      w: cell.offsetWidth,
      h: cell.offsetHeight
    };
  }

  function placeTileEl(tile) {
    var rect = cellRect(tile.r, tile.c);
    var el = tile.el;
    el.style.left = rect.left + "px";
    el.style.top = rect.top + "px";
    el.style.width = rect.w + "px";
    el.style.height = rect.h + "px";
    var fs = Math.max(18, Math.round(rect.w * (String(tile.value).length > 1 ? 0.42 : 0.5)));
    el.style.fontSize = fs + "px";
  }

  function makeTileEl(tile) {
    var el = document.createElement("div");
    el.className = "tile " + COLORS[(tile.value - 1) % COLORS.length] + " new";
    el.textContent = tile.value;
    elTiles.appendChild(el);
    tile.el = el;
    placeTileEl(tile);
    setTimeout(function () { el.classList.remove("new"); }, 200);
    return el;
  }

  /* ---------- 游戏初始化 ---------- */
  function emptyGrid() {
    var g = [];
    for (var r = 0; r < SIZE; r++) {
      g.push([]);
      for (var c = 0; c < SIZE; c++) g[r].push(null);
    }
    return g;
  }

  function bestKey() {
    return "coumshu_best_" + state.target + "_" + state.difficulty;
  }
  function loadBest() {
    var v = parseInt(localStorage.getItem(bestKey()) || "0", 10);
    state.best = isNaN(v) ? 0 : v;
  }
  function saveBest() {
    if (state.score > state.best) {
      state.best = state.score;
      localStorage.setItem(bestKey(), String(state.best));
    }
  }

  function startGame(target) {
    state.target = target;
    state.grid = emptyGrid();
    state.tiles = [];
    state.score = 0;
    state.over = false;
    state.idSeq = 1;
    elTiles.innerHTML = "";
    elOverlay.classList.remove("show");
    elGoal.textContent = "凑 " + target + " · " + diffCfg().label;
    loadBest();
    updateScore();
    randomHint();

    elHome.classList.add("hidden");
    elGame.classList.add("active");

    // 首屏放两个方块
    buildGridBg();
    spawnTile();
    spawnTile();
    renderAll();
  }

  function backHome() {
    elGame.classList.remove("active");
    elHome.classList.remove("hidden");
  }

  /* ---------- 生成新方块 ---------- */
  // 偏小的随机值（值域 1 ~ 目标数-1）
  function randomSmallValue() {
    var max = state.target - 1;
    var pool = [];
    for (var v = 1; v <= max; v++) {
      var weight = Math.max(1, Math.round((max - v) / 3) + 1);
      for (var w = 0; w < weight; w++) pool.push(v);
    }
    return pool[Math.floor(Math.random() * pool.length)];
  }

  // 均匀随机值（困难档回退用）
  function randomUniformValue() {
    return 1 + Math.floor(Math.random() * (state.target - 1));
  }

  // 按难度：一定概率生成场上某个数的“好朋友”(目标数 - 某数)
  function chooseSpawnValue() {
    var cfg = diffCfg();
    var t = state.target;
    var comps = [];
    for (var i = 0; i < state.tiles.length; i++) {
      var c = t - state.tiles[i].value;
      if (c >= 1 && c <= t - 1) comps.push(c);
    }
    if (comps.length && Math.random() < cfg.friendRate) {
      return comps[Math.floor(Math.random() * comps.length)];
    }
    return cfg.uniform ? randomUniformValue() : randomSmallValue();
  }

  // 成功移动后按难度决定生成 1 或 2 个新方块
  function spawnAfterMove() {
    var cfg = diffCfg();
    var n = 1;
    // 困难：空格较多时有概率一次生成两个
    if (cfg.doubleSpawnChance > 0 && emptyCells().length >= 6 &&
        Math.random() < cfg.doubleSpawnChance) {
      n = 2;
    }
    for (var i = 0; i < n; i++) spawnTile();
  }

  function emptyCells() {
    var cells = [];
    for (var r = 0; r < SIZE; r++)
      for (var c = 0; c < SIZE; c++)
        if (!state.grid[r][c]) cells.push({ r: r, c: c });
    return cells;
  }

  function spawnTile() {
    var cells = emptyCells();
    if (!cells.length) return null;
    var pos = cells[Math.floor(Math.random() * cells.length)];
    var tile = {
      id: state.idSeq++,
      value: chooseSpawnValue(),
      r: pos.r,
      c: pos.c,
      el: null,
      fresh: true
    };
    state.grid[pos.r][pos.c] = tile;
    state.tiles.push(tile);
    return tile;
  }

  /* ---------- 渲染 ---------- */
  function renderAll() {
    for (var i = 0; i < state.tiles.length; i++) {
      var t = state.tiles[i];
      if (!t.el) makeTileEl(t);
      else placeTileEl(t);
    }
  }

  function updateScore() {
    elScore.textContent = state.score;
    elBest.textContent = state.best;
  }

  function randomHint() {
    var msg = HINTS[Math.floor(Math.random() * HINTS.length)];
    elHint.textContent = msg.replace("{t}", state.target);
  }

  /* ---------- 移动 / 凑数消除 ---------- */
  // 方向向量
  var VECTORS = {
    left:  { r: 0, c: -1 },
    right: { r: 0, c: 1 },
    up:    { r: -1, c: 0 },
    down:  { r: 1, c: 0 }
  };

  function buildTraversals(vec) {
    var rows = [], cols = [];
    for (var i = 0; i < SIZE; i++) { rows.push(i); cols.push(i); }
    if (vec.r === 1) rows.reverse();  // 向下：先处理下面的
    if (vec.c === 1) cols.reverse();  // 向右：先处理右边的
    return { rows: rows, cols: cols };
  }

  function withinBounds(r, c) {
    return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
  }

  function findFarthest(r, c, vec) {
    var pr = r, pc = c;
    var nr = r + vec.r, nc = c + vec.c;
    while (withinBounds(nr, nc) && !state.grid[nr][nc]) {
      pr = nr; pc = nc;
      nr = nr + vec.r; nc = nc + vec.c;
    }
    return { far: { r: pr, c: pc }, next: { r: nr, c: nc } };
  }

  function move(dir) {
    if (state.over) return;
    var vec = VECTORS[dir];
    var trav = buildTraversals(vec);
    var moved = false;
    var mergedCount = 0;
    var removed = [];
    var locked = {}; // 本步已参与消除的方块，防止重复配对

    for (var ri = 0; ri < trav.rows.length; ri++) {
      for (var ci = 0; ci < trav.cols.length; ci++) {
        var r = trav.rows[ri], c = trav.cols[ci];
        var tile = state.grid[r][c];
        if (!tile || locked[tile.id]) continue;

        var res = findFarthest(r, c, vec);
        var nextPos = res.next;
        var nextTile = withinBounds(nextPos.r, nextPos.c) ? state.grid[nextPos.r][nextPos.c] : null;

        if (nextTile && !locked[nextTile.id] &&
            (nextTile.value + tile.value === state.target)) {
          // 滑动方向撞上且凑成目标：两块一起消除
          state.grid[r][c] = null;
          state.grid[nextPos.r][nextPos.c] = null;
          tile.r = nextPos.r; tile.c = nextPos.c;
          locked[tile.id] = true;
          locked[nextTile.id] = true;
          removed.push(tile, nextTile);
          state.score += state.target;
          mergedCount++;
          moved = true;
        } else {
          var far = res.far;
          if (far.r !== r || far.c !== c) {
            state.grid[r][c] = null;
            state.grid[far.r][far.c] = tile;
            tile.r = far.r; tile.c = far.c;
            moved = true;
          }
        }
      }
    }

    if (!moved) return;

    if (mergedCount >= 2) {
      var bonus = (mergedCount - 1) * 5;
      state.score += bonus;
      showCombo(mergedCount, bonus);
    }

    renderAll();

    if (removed.length) {
      playSound("merge");
      for (var k = 0; k < removed.length; k++) {
        var rt = removed[k];
        placeTileEl(rt);
        rt.el.classList.add("gone");
      }
      (function (rem) {
        setTimeout(function () {
          for (var m = 0; m < rem.length; m++) {
            if (rem[m].el && rem[m].el.parentNode) rem[m].el.parentNode.removeChild(rem[m].el);
          }
        }, 170);
      })(removed);
      state.tiles = state.tiles.filter(function (t) { return removed.indexOf(t) === -1; });
    } else {
      playSound("move");
    }

    saveBest();
    updateScore();
    randomHint();

    setTimeout(function () {
      spawnAfterMove();
      renderAll();
      if (isGameOver()) endGame();
    }, 140);
  }

  function showCombo(count, bonus) {
    var f = document.createElement("div");
    f.className = "combo-float";
    f.textContent = "连消 x" + count + " +" + bonus;
    elBoard.appendChild(f);
    setTimeout(function () { if (f.parentNode) f.parentNode.removeChild(f); }, 750);
  }

  /* ---------- 结束判定 ---------- */
  function isGameOver() {
    if (emptyCells().length > 0) return false;
    // 检查是否还有相邻可凑数的组合
    for (var r = 0; r < SIZE; r++) {
      for (var c = 0; c < SIZE; c++) {
        var t = state.grid[r][c];
        if (!t) continue;
        if (c + 1 < SIZE && state.grid[r][c + 1] &&
            t.value + state.grid[r][c + 1].value === state.target) return false;
        if (r + 1 < SIZE && state.grid[r + 1][c] &&
            t.value + state.grid[r + 1][c].value === state.target) return false;
      }
    }
    return true;
  }

  function endGame() {
    state.over = true;
    saveBest();
    elOverSub.textContent = "这局得了 " + state.score + " 分" +
      (state.score >= state.best && state.score > 0 ? "，创造了新纪录！🎉" : "");
    elOverlay.classList.add("show");
    playSound("over");
  }

  /* ---------- 音效（Web Audio） ---------- */
  var audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
      catch (e) { audioCtx = null; }
    }
  }
  function beep(freq, dur, type) {
    if (!state.soundOn || !audioCtx) return;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || "sine";
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  }
  function playSound(kind) {
    if (!state.soundOn) return;
    ensureAudio();
    if (kind === "merge") { beep(660, 0.12, "triangle"); setTimeout(function(){beep(880,0.14,"triangle");},70); }
    else if (kind === "move") { beep(300, 0.05, "sine"); }
    else if (kind === "over") { beep(400,0.15,"sine"); setTimeout(function(){beep(260,0.25,"sine");},140); }
  }

  /* ---------- 输入：键盘 ---------- */
  document.addEventListener("keydown", function (e) {
    if (!elGame.classList.contains("active")) return;
    var map = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down",
                a: "left", d: "right", w: "up", s: "down" };
    var dir = map[e.key];
    if (dir) { e.preventDefault(); ensureAudio(); move(dir); }
  });

  /* ---------- 输入：触屏 / 鼠标滑动 ---------- */
  var swipe = { active: false, x0: 0, y0: 0 };
  var THRESHOLD = 24;

  function onStart(x, y) { swipe.active = true; swipe.x0 = x; swipe.y0 = y; ensureAudio(); }
  function onEnd(x, y) {
    if (!swipe.active) return;
    swipe.active = false;
    var dx = x - swipe.x0, dy = y - swipe.y0;
    if (Math.abs(dx) < THRESHOLD && Math.abs(dy) < THRESHOLD) return;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  }

  elBoard.addEventListener("touchstart", function (e) {
    var t = e.touches[0]; onStart(t.clientX, t.clientY);
  }, { passive: true });
  elBoard.addEventListener("touchend", function (e) {
    var t = e.changedTouches[0]; onEnd(t.clientX, t.clientY);
  }, { passive: true });

  elBoard.addEventListener("mousedown", function (e) { onStart(e.clientX, e.clientY); });
  window.addEventListener("mouseup", function (e) { onEnd(e.clientX, e.clientY); });

  /* ---------- 按钮 ---------- */
  var diffBtns = document.querySelectorAll(".diff-btn");
  for (var d = 0; d < diffBtns.length; d++) {
    diffBtns[d].addEventListener("click", function () {
      state.difficulty = this.getAttribute("data-diff") || "medium";
      for (var j = 0; j < diffBtns.length; j++) {
        diffBtns[j].classList.toggle("active", diffBtns[j] === this);
      }
    });
  }

  var levelBtns = document.querySelectorAll(".lv");
  for (var i = 0; i < levelBtns.length; i++) {
    levelBtns[i].addEventListener("click", function () {
      startGame(parseInt(this.getAttribute("data-target"), 10));
    });
  }
  document.getElementById("backBtn").addEventListener("click", backHome);
  document.getElementById("restartBtn").addEventListener("click", function () { startGame(state.target); });
  document.getElementById("overRestart").addEventListener("click", function () { startGame(state.target); });
  elSoundBtn.addEventListener("click", function () {
    state.soundOn = !state.soundOn;
    elSoundBtn.textContent = state.soundOn ? "🔊" : "🔇";
    if (state.soundOn) { ensureAudio(); playSound("move"); }
  });

  /* ---------- 窗口尺寸变化时重新定位 ---------- */
  var resizeTimer = null;
  window.addEventListener("resize", function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () {
      if (elGame.classList.contains("active")) renderAll();
    }, 120);
  });

  // 预构建背景，避免首帧空白
  buildGridBg();
})();
</script>
</body>
</html>
